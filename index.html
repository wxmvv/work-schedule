<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="工作排期台：按月、周、年和列表管理工作记录，并导出静态 HTML 分享。" />
  <title>工作排期台</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1747b0;
      --blue-soft: #eaf2ff;
      --ink: #12213a;
      --muted: #66758d;
      --line: #dce5f1;
      --line-soft: #edf2f8;
      --surface: #ffffff;
      --canvas: #f4f7fb;
      --shadow: 0 16px 44px rgba(28, 55, 95, 0.09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 2%, rgba(37, 99, 235, 0.07), transparent 24rem),
        var(--canvas);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }

    .app-shell { min-height: 100vh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(220, 229, 241, 0.9);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width: min(1480px, calc(100% - 40px));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: white;
      background: linear-gradient(145deg, #1d4ed8, #4388ff);
      border-radius: 13px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.24);
    }

    .brand h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: -0.02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    .btn {
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 650;
      font-size: 14px;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: #b9c9dd; box-shadow: 0 6px 16px rgba(28, 55, 95, 0.08); }
    .btn:focus-visible, .icon-btn:focus-visible, .view-tab:focus-visible, .event-chip:focus-visible, .mini-event:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.2);
      outline-offset: 2px;
    }
    .btn-primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .btn-primary:hover { background: #1d55d6; border-color: #1d55d6; }
    .btn-danger { color: #bd2d3b; background: #fff7f8; border-color: #f3ccd1; }
    .btn svg, .icon-btn svg { width: 17px; height: 17px; }

    .main {
      width: min(1480px, calc(100% - 40px));
      margin: 28px auto 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .hero h2 { margin: 0; font-size: clamp(26px, 3vw, 42px); letter-spacing: -0.045em; line-height: 1.08; }
    .hero-copy { max-width: 620px; margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .stats { display: flex; gap: 10px; }
    .stat {
      min-width: 110px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .stat-value { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; font-weight: 780; letter-spacing: -0.06em; }
    .stat-label { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .workspace {
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .workspace-toolbar {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) auto;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .view-switch {
      padding: 4px;
      display: inline-flex;
      gap: 3px;
      background: #f0f4f9;
      border-radius: 12px;
    }

    .view-tab {
      min-width: 56px;
      height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .view-tab.active { color: var(--blue-dark); background: #fff; box-shadow: 0 2px 9px rgba(38, 61, 94, 0.1); }

    .date-nav { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .date-nav h3 { min-width: 190px; margin: 0 8px; text-align: center; font-size: 18px; letter-spacing: -0.02em; }
    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .filters { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; color: #8b98aa; transform: translateY(-50%); pointer-events: none; }
    .search-input, .filter-select {
      height: 38px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    .search-input { width: 176px; padding: 0 12px 0 34px; }
    .filter-select { max-width: 130px; padding: 0 28px 0 11px; }
    .search-input:focus, .filter-select:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #7c9fe5; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

    .calendar-view { min-height: 630px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
    .weekday { padding: 11px 8px; color: var(--muted); text-align: center; font-size: 12px; font-weight: 700; }
    .weekday.weekend { color: #ac6670; }
    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(105px, 1fr); }
    .day-cell { min-width: 0; padding: 8px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); background: #fff; }
    .day-cell:nth-child(7n) { border-right: 0; }
    .day-cell.outside { background: #fafbfd; }
    .day-cell.outside .day-number { color: #b8c1cf; }
    .day-head { height: 26px; display: flex; align-items: center; justify-content: space-between; }
    .day-number { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; font-size: 12px; font-weight: 730; }
    .day-cell.today .day-number { color: #fff; background: var(--blue); box-shadow: 0 5px 12px rgba(37, 99, 235, 0.25); }
    .day-add { opacity: 0; border: 0; background: none; color: var(--blue); cursor: pointer; font-size: 20px; line-height: 1; }
    .day-cell:hover .day-add, .day-add:focus-visible { opacity: 1; }
    .events { margin-top: 5px; display: grid; gap: 4px; }
    .event-chip {
      width: 100%;
      min-width: 0;
      padding: 5px 7px;
      border: 0;
      border-left: 3px solid var(--event-color, var(--blue));
      border-radius: 6px;
      color: #27405f;
      background: color-mix(in srgb, var(--event-color, var(--blue)) 10%, white);
      text-align: left;
      font-size: 11px;
      line-height: 1.35;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-time { margin-right: 4px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .more-count { padding-left: 9px; color: var(--muted); font-size: 11px; }

    .week-view { overflow-x: auto; }
    .week-grid { min-width: 900px; display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); min-height: 620px; }
    .week-day { border-right: 1px solid var(--line-soft); }
    .week-day:last-child { border-right: 0; }
    .week-day-head { position: sticky; top: 76px; z-index: 5; padding: 16px 12px 12px; text-align: center; background: white; border-bottom: 1px solid var(--line); }
    .week-day.today .week-day-head { color: var(--blue); }
    .week-name { display: block; color: var(--muted); font-size: 11px; }
    .week-date { display: block; margin-top: 5px; font-size: 22px; font-weight: 760; }
    .week-items { min-height: 540px; padding: 12px 8px; display: grid; align-content: start; gap: 8px; background-image: linear-gradient(to bottom, transparent 47px, #f1f4f8 48px); background-size: 100% 48px; }
    .week-event {
      padding: 10px;
      border-left: 3px solid var(--event-color);
      border-radius: 8px;
      background: color-mix(in srgb, var(--event-color) 10%, white);
      cursor: pointer;
    }
    .week-event strong { display: block; font-size: 12px; line-height: 1.4; }
    .week-event span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }

    .year-view { padding: 20px; }
    .year-grid { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; }
    .mini-month { padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .mini-month-header { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .mini-month-header h4 { margin: 0; font-size: 14px; }
    .mini-month-header button { border: 0; background: none; color: var(--blue); font-size: 11px; cursor: pointer; }
    .mini-weekdays, .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .mini-weekdays span { color: #96a1b1; text-align: center; font-size: 9px; }
    .mini-day { position: relative; aspect-ratio: 1; display: grid; place-items: center; color: #657187; border-radius: 6px; font-size: 9px; }
    .mini-day.has-event { color: #1747b0; background: var(--blue-soft); font-weight: 800; cursor: pointer; }
    .mini-day.today { box-shadow: inset 0 0 0 1px var(--blue); }
    .mini-day.empty { visibility: hidden; }

    .list-view { padding: 10px 22px 28px; }
    .list-group { margin-top: 22px; }
    .list-group-title { margin: 0 0 10px; display: flex; align-items: baseline; gap: 9px; font-size: 15px; }
    .list-group-title span { color: var(--muted); font-size: 11px; font-weight: 500; }
    .record-row {
      display: grid;
      grid-template-columns: 110px minmax(220px, 1.4fr) minmax(130px, 0.7fr) minmax(120px, 0.7fr) 90px 34px;
      align-items: center;
      gap: 16px;
      min-height: 70px;
      padding: 12px 8px;
      border-top: 1px solid var(--line-soft);
    }
    .record-date { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
    .record-main { min-width: 0; }
    .record-main strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .record-main span { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .record-meta { color: #44536a; font-size: 12px; }
    .status-badge { width: fit-content; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .status-todo { color: #62531a; background: #fff6cf; }
    .status-doing { color: #164f9a; background: #e4efff; }
    .status-done { color: #21643e; background: #e2f6e9; }
    .status-blocked { color: #9b3441; background: #ffe7ea; }
    .row-edit { border: 0; background: none; color: var(--muted); cursor: pointer; }

    .empty-state { min-height: 480px; padding: 40px; display: grid; place-items: center; text-align: center; }
    .empty-illustration { width: 90px; height: 90px; margin: 0 auto 18px; display: grid; place-items: center; color: var(--blue); background: var(--blue-soft); border-radius: 28px; transform: rotate(-4deg); }
    .empty-illustration svg { width: 42px; height: 42px; }
    .empty-state h3 { margin: 0; font-size: 18px; }
    .empty-state p { margin: 8px 0 20px; color: var(--muted); font-size: 13px; }

    .legend { padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); background: #fbfcfe; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 14px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
    .data-note { color: #8793a5; font-size: 11px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(12, 24, 43, 0.42);
      backdrop-filter: blur(5px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(700px, 100%);
      max-height: min(840px, calc(100vh - 40px));
      overflow: auto;
      background: #fff;
      border-radius: 19px;
      box-shadow: 0 28px 90px rgba(11, 28, 54, 0.28);
    }
    .modal-header { position: sticky; top: 0; z-index: 2; padding: 20px 22px 15px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .modal-header h3 { margin: 0; font-size: 19px; }
    .modal-close { width: 34px; height: 34px; border: 0; border-radius: 10px; background: #f2f5f9; cursor: pointer; font-size: 19px; }
    .record-form { padding: 20px 22px 22px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 720; }
    .required { color: #d4374d; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    .field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
    .color-options { display: flex; align-items: center; gap: 9px; min-height: 42px; }
    .color-option { position: relative; }
    .color-option input { position: absolute; opacity: 0; pointer-events: none; }
    .color-swatch { width: 24px; height: 24px; display: block; border: 3px solid white; border-radius: 50%; background: var(--swatch); box-shadow: 0 0 0 1px #cad4e1; cursor: pointer; }
    .color-option input:checked + .color-swatch { box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 34%, white); transform: scale(1.08); }
    .form-error { min-height: 18px; margin: 12px 0 0; color: #c42f43; font-size: 12px; }
    .modal-actions { margin-top: 4px; padding-top: 18px; display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); }
    .modal-actions-right { display: flex; gap: 9px; margin-left: auto; }

    .detail-modal { width: min(580px, 100%); overflow: hidden; }
    .detail-accent { height: 6px; background: var(--detail-color, var(--blue)); }
    .detail-content { padding: 22px; }
    .detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .detail-title-row h3 { margin: 0; font-size: 22px; line-height: 1.35; letter-spacing: -0.025em; }
    .detail-project { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .detail-grid { margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
    .detail-item { min-height: 76px; padding: 13px 15px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
    .detail-item:nth-child(2n) { border-right: 0; }
    .detail-item:nth-last-child(-n + 2) { border-bottom: 0; }
    .detail-label { display: block; color: var(--muted); font-size: 10px; font-weight: 720; letter-spacing: .08em; text-transform: uppercase; }
    .detail-value { display: block; margin-top: 7px; color: #33445d; font-size: 13px; line-height: 1.5; }
    .detail-notes { margin-top: 18px; padding: 15px 16px; color: #3e4d63; background: #f7f9fc; border-radius: 12px; font-size: 13px; line-height: 1.75; white-space: pre-wrap; }
    .detail-notes-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 720; letter-spacing: .08em; }
    .detail-footer { margin-top: 18px; display: flex; justify-content: flex-end; }

    .toast-stack { position: fixed; right: 20px; bottom: 20px; z-index: 120; display: grid; gap: 9px; }
    .toast { min-width: 260px; padding: 13px 16px; color: #fff; background: #17253a; border-radius: 11px; box-shadow: 0 12px 30px rgba(12, 24, 43, .24); font-size: 13px; animation: toast-in 220ms ease both; }
    .toast.error { background: #a6293b; }

    .share-banner { display: none; padding: 8px 20px; color: #164f9a; background: #eaf2ff; border-bottom: 1px solid #cee0ff; text-align: center; font-size: 12px; }
    body.shared-mode .share-banner { display: block; }
    body.shared-mode .editor-only { display: none !important; }
    body.shared-mode .main { margin-top: 24px; }
    body.shared-mode .event-chip, body.shared-mode .week-event, body.shared-mode .record-row { cursor: pointer; }

    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    @media (max-width: 1120px) {
      .workspace-toolbar { grid-template-columns: 1fr auto; }
      .date-nav { grid-row: 2; grid-column: 1 / -1; }
      .filters { justify-content: flex-end; }
      .year-grid { grid-template-columns: repeat(3, minmax(210px, 1fr)); }
      .record-row { grid-template-columns: 100px minmax(180px, 1fr) 120px 100px 80px 30px; gap: 10px; }
    }

    @media (max-width: 780px) {
      .topbar-inner, .main { width: min(100% - 24px, 1480px); }
      .topbar-inner { min-height: 68px; }
      .brand p { display: none; }
      .btn-label-hide { display: none; }
      .hero { grid-template-columns: 1fr; align-items: start; }
      .stats { width: 100%; }
      .stat { min-width: 0; flex: 1; }
      .workspace-toolbar { grid-template-columns: 1fr; gap: 12px; }
      .view-switch { width: 100%; }
      .view-tab { min-width: 0; flex: 1; }
      .date-nav { grid-row: auto; grid-column: auto; order: -1; }
      .date-nav h3 { min-width: 0; flex: 1; }
      .filters { justify-content: stretch; }
      .search-wrap { flex: 1; }
      .search-input { width: 100%; }
      .filter-select { max-width: 118px; }
      .calendar-view { overflow-x: auto; }
      .weekdays, .month-grid { min-width: 700px; }
      .year-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      .record-row { grid-template-columns: 92px minmax(150px, 1fr) 86px 30px; }
      .record-row .record-place, .record-row .record-owner { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }

    @media (max-width: 520px) {
      .topbar-inner { gap: 10px; }
      .brand-mark { width: 38px; height: 38px; }
      .brand h1 { font-size: 16px; }
      .header-actions { gap: 6px; }
      .header-actions .btn { padding: 0 11px; }
      .add-label { display: none; }
      .main { margin-top: 20px; }
      .hero h2 { font-size: 28px; }
      .stats { gap: 6px; }
      .stat { padding: 11px; }
      .stat-value { font-size: 20px; }
      .filters { flex-wrap: wrap; }
      .search-wrap { flex-basis: 100%; }
      .filter-select { flex: 1; max-width: none; }
      .year-view { padding: 12px; }
      .year-grid { grid-template-columns: 1fr; }
      .list-view { padding-inline: 12px; }
      .record-row { grid-template-columns: 82px minmax(130px, 1fr) 30px; }
      .record-status { display: none; }
      .legend { align-items: flex-start; flex-direction: column; }
      .modal-backdrop { padding: 0; align-items: end; }
      .modal { max-height: 94vh; border-radius: 20px 20px 0 0; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-item, .detail-item:nth-child(2n), .detail-item:nth-last-child(-n + 2) { border-right: 0; border-bottom: 1px solid var(--line-soft); }
      .detail-item:last-child { border-bottom: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @media print {
      body { background: #fff; }
      .topbar { position: static; }
      .editor-only, .filters, .date-nav button, .toast-stack { display: none !important; }
      .main { width: 100%; margin-top: 18px; }
      .workspace { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="share-banner">这是一个只读排期快照 · 生成于 <span id="sharedAt">—</span></div>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v3M19 3v3M4 9h16M6 13h4v4H6z"/><rect x="3" y="5" width="18" height="16" rx="3"/></svg>
          </div>
          <div><h1>工作排期台</h1><p>把计划放进时间，把进度留在一处</p></div>
        </div>
        <div class="header-actions">
          <button class="btn editor-only" id="importBtn" title="导入 JSON 数据">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></svg><span class="btn-label-hide">导入数据</span>
          </button>
          <input id="fileInput" class="editor-only" type="file" accept="application/json,.json" hidden />
          <button class="btn editor-only" id="exportJsonBtn" title="导出 JSON 数据备份">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M5 4h14"/></svg><span class="btn-label-hide">导出数据</span>
          </button>
          <button class="btn" id="exportHtmlBtn" title="导出可独立打开的静态 HTML">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 14h8M8 18h5"/></svg><span class="btn-label-hide">导出静态 HTML</span>
          </button>
          <button class="btn btn-primary editor-only" id="addBtn" aria-label="添加记录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span class="add-label">添加记录</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <div>
          <p class="eyebrow">WORK SCHEDULE / 排期总览</p>
          <h2>今天要推进什么？</h2>
          <p class="hero-copy">用月、周、年和列表四种尺度查看工作。所有编辑会自动保存在当前浏览器中，导出后可直接把单个 HTML 文件发给任何人。</p>
        </div>
        <div class="stats" aria-label="排期统计">
          <div class="stat"><span class="stat-value" id="totalStat">0</span><span class="stat-label">全部记录</span></div>
          <div class="stat"><span class="stat-value" id="activeStat">0</span><span class="stat-label">进行中</span></div>
          <div class="stat"><span class="stat-value" id="monthStat">0</span><span class="stat-label">本月安排</span></div>
        </div>
      </section>

      <section class="workspace" aria-label="工作排期">
        <div class="workspace-toolbar">
          <div class="view-switch" role="tablist" aria-label="时间视图">
            <button class="view-tab active" data-view="month" role="tab">月</button>
            <button class="view-tab" data-view="week" role="tab">周</button>
            <button class="view-tab" data-view="year" role="tab">年</button>
            <button class="view-tab" data-view="list" role="tab">列表</button>
          </div>
          <div class="date-nav">
            <button class="icon-btn" id="prevBtn" aria-label="上一时间段"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="btn" id="todayBtn">今天</button>
            <h3 id="rangeTitle">—</h3>
            <button class="icon-btn" id="nextBtn" aria-label="下一时间段"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div class="filters">
            <label class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="searchInput" class="search-input" type="search" placeholder="搜索工作内容" aria-label="搜索工作内容" />
            </label>
            <select id="statusFilter" class="filter-select" aria-label="按状态筛选"><option value="all">全部状态</option><option value="todo">待开始</option><option value="doing">进行中</option><option value="done">已完成</option><option value="blocked">受阻</option></select>
            <select id="ownerFilter" class="filter-select" aria-label="按负责人筛选"><option value="all">全部负责人</option></select>
          </div>
        </div>
        <div id="viewRoot"></div>
        <div class="legend">
          <div class="legend-items">
            <span class="legend-item"><i class="legend-dot" style="background:#2563eb"></i>重点工作</span>
            <span class="legend-item"><i class="legend-dot" style="background:#0f9f84"></i>协作事项</span>
            <span class="legend-item"><i class="legend-dot" style="background:#ee8a1c"></i>会议沟通</span>
            <span class="legend-item"><i class="legend-dot" style="background:#8b5cf6"></i>个人计划</span>
          </div>
          <span class="data-note" id="dataNote">数据仅保存在当前浏览器</span>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="recordModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><h3 id="modalTitle">添加工作记录</h3><button class="modal-close" id="closeModalBtn" aria-label="关闭">×</button></div>
      <form class="record-form" id="recordForm">
        <input type="hidden" id="recordId" />
        <div class="form-grid">
          <div class="field full"><label for="recordTitle">工作内容 <span class="required">*</span></label><input id="recordTitle" required maxlength="80" placeholder="例如：完成第三季度项目复盘" /></div>
          <div class="field"><label for="recordProject">项目 / 分类</label><input id="recordProject" maxlength="40" placeholder="例如：官网改版" /></div>
          <div class="field"><label for="recordOwner">负责人</label><input id="recordOwner" maxlength="30" placeholder="例如：王小明" /></div>
          <div class="field"><label for="recordStartDate">开始日期 <span class="required">*</span></label><input id="recordStartDate" type="date" required /></div>
          <div class="field"><label for="recordEndDate">结束日期 <span class="required">*</span></label><input id="recordEndDate" type="date" required /></div>
          <div class="field"><label for="recordStartTime">开始时间</label><input id="recordStartTime" type="time" /></div>
          <div class="field"><label for="recordEndTime">结束时间</label><input id="recordEndTime" type="time" /></div>
          <div class="field"><label for="recordStatus">工作状态</label><select id="recordStatus"><option value="todo">待开始</option><option value="doing">进行中</option><option value="done">已完成</option><option value="blocked">受阻</option></select></div>
          <div class="field"><label for="recordPriority">优先级</label><select id="recordPriority"><option value="normal">普通</option><option value="high">高</option><option value="urgent">紧急</option></select></div>
          <div class="field"><label for="recordPlace">地点 / 渠道</label><input id="recordPlace" maxlength="60" placeholder="会议室、客户现场或线上" /></div>
          <div class="field"><label>标记颜色</label><div class="color-options" id="colorOptions"></div></div>
          <div class="field full"><label for="recordNotes">补充说明</label><textarea id="recordNotes" maxlength="500" placeholder="记录目标、依赖事项或交付标准"></textarea></div>
        </div>
        <p class="form-error" id="formError" aria-live="polite"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteBtn" hidden>删除记录</button>
          <div class="modal-actions-right"><button type="button" class="btn" id="cancelBtn">取消</button><button type="submit" class="btn btn-primary">保存记录</button></div>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-backdrop" id="detailModal" hidden>
    <article class="modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-accent" id="detailAccent"></div>
      <div class="modal-header"><span></span><button class="modal-close" id="closeDetailBtn" aria-label="关闭任务详情">×</button></div>
      <div class="detail-content" id="detailContent"></div>
    </article>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'work-schedule.records.v1';
      const COLORS = ['#2563eb', '#0f9f84', '#ee8a1c', '#8b5cf6', '#e14f64', '#64748b'];
      const STATUS = {
        todo: { label: '待开始', className: 'status-todo' },
        doing: { label: '进行中', className: 'status-doing' },
        done: { label: '已完成', className: 'status-done' },
        blocked: { label: '受阻', className: 'status-blocked' }
      };
      const WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const sharedMode = Boolean(window.__SHARED_MODE__);
      const today = startOfDay(new Date());
      let cursor = window.__SHARED_CURSOR__ ? parseDate(window.__SHARED_CURSOR__) : new Date(today);
      let activeView = window.__SHARED_VIEW__ || 'month';
      let records = sharedMode ? normalizeRecords(window.__SHARED_WORK_RECORDS__ || []) : loadRecords();

      const els = {
        viewRoot: document.getElementById('viewRoot'), rangeTitle: document.getElementById('rangeTitle'),
        search: document.getElementById('searchInput'), status: document.getElementById('statusFilter'), owner: document.getElementById('ownerFilter'),
        total: document.getElementById('totalStat'), active: document.getElementById('activeStat'), month: document.getElementById('monthStat'),
        modal: document.getElementById('recordModal'), form: document.getElementById('recordForm'), formError: document.getElementById('formError'),
        modalTitle: document.getElementById('modalTitle'), deleteBtn: document.getElementById('deleteBtn'), toast: document.getElementById('toastStack'),
        detailModal: document.getElementById('detailModal'), detailContent: document.getElementById('detailContent'), detailAccent: document.getElementById('detailAccent')
      };

      seedIfEmpty();
      setupColorOptions();
      bindEvents();
      applyMode();
      refresh();

      function seedIfEmpty() {
        if (records.length || sharedMode) return;
        const y = today.getFullYear();
        const m = today.getMonth();
        const date = (offset) => toISODate(new Date(y, m, today.getDate() + offset));
        records = [
          makeRecord({ title: '项目周会与本周任务拆解', project: '团队协作', owner: '我', startDate: date(0), endDate: date(0), startTime: '10:00', endTime: '11:00', status: 'doing', color: '#ee8a1c', place: '线上会议', notes: '同步关键节点与风险。' }),
          makeRecord({ title: '完成排期页面第一版', project: '工作排期台', owner: '我', startDate: date(1), endDate: date(3), startTime: '09:30', endTime: '18:00', status: 'todo', priority: 'high', color: '#2563eb', notes: '完成核心交互并自测。' }),
          makeRecord({ title: '客户方案评审', project: '客户交付', owner: '王小明', startDate: date(5), endDate: date(5), startTime: '14:00', endTime: '16:00', status: 'todo', color: '#0f9f84', place: '3F 会议室' })
        ];
        saveRecords();
      }

      function bindEvents() {
        document.getElementById('addBtn')?.addEventListener('click', () => openModal());
        document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
        document.getElementById('cancelBtn')?.addEventListener('click', closeModal);
        document.getElementById('deleteBtn')?.addEventListener('click', deleteCurrentRecord);
        document.getElementById('prevBtn').addEventListener('click', () => moveCursor(-1));
        document.getElementById('nextBtn').addEventListener('click', () => moveCursor(1));
        document.getElementById('todayBtn').addEventListener('click', () => { cursor = new Date(today); refresh(); });
        document.getElementById('exportHtmlBtn')?.addEventListener('click', exportStaticHtml);
        document.getElementById('exportJsonBtn')?.addEventListener('click', exportJsonData);
        document.getElementById('importBtn')?.addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput')?.addEventListener('change', importData);
        els.form?.addEventListener('submit', saveForm);
        els.search.addEventListener('input', renderView);
        els.status.addEventListener('change', renderView);
        els.owner.addEventListener('change', renderView);
        els.modal?.addEventListener('mousedown', (event) => { if (event.target === els.modal) closeModal(); });
        els.detailModal.addEventListener('mousedown', (event) => { if (event.target === els.detailModal) closeDetailModal(); });
        document.getElementById('closeDetailBtn').addEventListener('click', closeDetailModal);
        document.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          if (els.modal && !els.modal.hidden) closeModal();
          if (!els.detailModal.hidden) closeDetailModal();
        });
        document.querySelectorAll('.view-tab').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
        els.viewRoot.addEventListener('click', handleViewClick);
      }

      function applyMode() {
        if (!sharedMode) return;
        document.body.classList.add('shared-mode');
        document.getElementById('dataNote').textContent = '只读快照';
        const sharedAt = document.getElementById('sharedAt');
        if (sharedAt) sharedAt.textContent = window.__SHARED_AT__ || '—';
      }

      function refresh() {
        populateOwners();
        renderStats();
        renderView();
      }

      function setView(view) {
        activeView = view;
        document.querySelectorAll('.view-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.view === view));
        renderView();
      }

      function moveCursor(direction) {
        if (activeView === 'week') cursor = addDays(cursor, 7 * direction);
        else if (activeView === 'year') cursor = new Date(cursor.getFullYear() + direction, cursor.getMonth(), 1);
        else cursor = new Date(cursor.getFullYear(), cursor.getMonth() + direction, 1);
        refresh();
      }

      function filteredRecords() {
        const query = els.search.value.trim().toLowerCase();
        const status = els.status.value;
        const owner = els.owner.value;
        return records.filter(record => {
          const haystack = [record.title, record.project, record.owner, record.place, record.notes].join(' ').toLowerCase();
          return (!query || haystack.includes(query)) && (status === 'all' || record.status === status) && (owner === 'all' || record.owner === owner);
        }).sort(compareRecords);
      }

      function renderStats() {
        if (!els.total || !els.active || !els.month) return;
        const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
        const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        els.total.textContent = records.length;
        els.active.textContent = records.filter(r => r.status === 'doing').length;
        els.month.textContent = records.filter(r => overlaps(r, monthStart, monthEnd)).length;
      }

      function populateOwners() {
        const current = els.owner.value;
        const owners = [...new Set(records.map(r => r.owner).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
        els.owner.innerHTML = '<option value="all">全部负责人</option>' + owners.map(owner => `<option value="${escapeHTML(owner)}">${escapeHTML(owner)}</option>`).join('');
        els.owner.value = owners.includes(current) ? current : 'all';
      }

      function renderView() {
        document.querySelectorAll('.view-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.view === activeView));
        const data = filteredRecords();
        if (activeView === 'month') renderMonth(data);
        if (activeView === 'week') renderWeek(data);
        if (activeView === 'year') renderYear(data);
        if (activeView === 'list') renderList(data);
      }

      function renderMonth(data) {
        const year = cursor.getFullYear();
        const month = cursor.getMonth();
        els.rangeTitle.textContent = `${year}年${month + 1}月`;
        const first = new Date(year, month, 1);
        const mondayIndex = (first.getDay() + 6) % 7;
        const gridStart = addDays(first, -mondayIndex);
        let html = '<div class="calendar-view"><div class="weekdays">' + ['周一','周二','周三','周四','周五','周六','周日'].map((name, index) => `<div class="weekday ${index > 4 ? 'weekend' : ''}">${name}</div>`).join('') + '</div><div class="month-grid">';
        for (let i = 0; i < 42; i++) {
          const day = addDays(gridStart, i);
          const iso = toISODate(day);
          const dayRecords = data.filter(r => coversDate(r, day));
          const visible = dayRecords.slice(0, 3);
          html += `<div class="day-cell ${day.getMonth() !== month ? 'outside' : ''} ${isSameDay(day, today) ? 'today' : ''}">
            <div class="day-head"><span class="day-number">${day.getDate()}</span>${sharedMode ? '' : `<button class="day-add editor-only" data-add-date="${iso}" aria-label="在${iso}添加记录">+</button>`}</div>
            <div class="events">${visible.map(r => eventChip(r, day)).join('')}${dayRecords.length > 3 ? `<span class="more-count">还有 ${dayRecords.length - 3} 项</span>` : ''}</div>
          </div>`;
        }
        els.viewRoot.innerHTML = html + '</div></div>';
      }

      function eventChip(record, day) {
        const isStart = record.startDate === toISODate(day);
        const time = isStart && record.startTime ? `<span class="event-time">${escapeHTML(record.startTime)}</span>` : '';
        const title = `${record.title}${record.owner ? ' · ' + record.owner : ''}`;
        return `<button class="event-chip" data-record-id="${record.id}" style="--event-color:${record.color}" title="${escapeHTML(title)}">${time}${escapeHTML(record.title)}</button>`;
      }

      function renderWeek(data) {
        const start = startOfWeek(cursor);
        const end = addDays(start, 6);
        els.rangeTitle.textContent = `${formatShortDate(start)} — ${formatShortDate(end)}`;
        let html = '<div class="week-view"><div class="week-grid">';
        for (let i = 0; i < 7; i++) {
          const day = addDays(start, i);
          const dayRecords = data.filter(r => coversDate(r, day));
          html += `<section class="week-day ${isSameDay(day, today) ? 'today' : ''}"><header class="week-day-head"><span class="week-name">${WEEK_NAMES[day.getDay()]}</span><span class="week-date">${day.getDate()}</span></header><div class="week-items">`;
          html += dayRecords.length ? dayRecords.map(r => `<article class="week-event" data-record-id="${r.id}" style="--event-color:${r.color}"><strong>${escapeHTML(r.title)}</strong><span>${escapeHTML(formatTimeRange(r))}</span><span>${escapeHTML([r.owner, r.place].filter(Boolean).join(' · ') || '暂无负责人和地点')}</span></article>`).join('') : `<button class="day-add editor-only" data-add-date="${toISODate(day)}" style="opacity:1;margin:auto" aria-label="添加记录">+</button>`;
          html += '</div></section>';
        }
        els.viewRoot.innerHTML = html + '</div></div>';
      }

      function renderYear(data) {
        const year = cursor.getFullYear();
        els.rangeTitle.textContent = `${year}年`;
        let html = '<div class="year-view"><div class="year-grid">';
        for (let month = 0; month < 12; month++) {
          const first = new Date(year, month, 1);
          const days = new Date(year, month + 1, 0).getDate();
          const pad = (first.getDay() + 6) % 7;
          const monthCount = data.filter(r => overlaps(r, first, new Date(year, month + 1, 0))).length;
          html += `<section class="mini-month"><header class="mini-month-header"><h4>${month + 1}月</h4><button data-open-month="${month}">${monthCount} 项</button></header><div class="mini-weekdays">${['一','二','三','四','五','六','日'].map(x => `<span>${x}</span>`).join('')}</div><div class="mini-days">`;
          for (let i = 0; i < pad; i++) html += '<span class="mini-day empty">0</span>';
          for (let day = 1; day <= days; day++) {
            const date = new Date(year, month, day);
            const count = data.filter(r => coversDate(r, date)).length;
            html += `<span class="mini-day ${count ? 'has-event' : ''} ${isSameDay(date, today) ? 'today' : ''}" data-open-date="${toISODate(date)}" title="${count ? count + ' 项安排' : ''}">${day}</span>`;
          }
          html += '</div></section>';
        }
        els.viewRoot.innerHTML = html + '</div></div>';
      }

      function renderList(data) {
        els.rangeTitle.textContent = `${cursor.getFullYear()}年全部记录`;
        const yearData = data.filter(record => parseDate(record.startDate).getFullYear() === cursor.getFullYear());
        if (!yearData.length) {
          els.viewRoot.innerHTML = emptyState('当前年份还没有匹配的记录');
          return;
        }
        const groups = groupBy(yearData, record => record.startDate.slice(0, 7));
        let html = '<div class="list-view">';
        Object.entries(groups).forEach(([month, items]) => {
          const [year, monthNumber] = month.split('-');
          html += `<section class="list-group"><h4 class="list-group-title">${Number(monthNumber)}月 <span>${items.length} 项记录</span></h4>`;
          html += items.map(r => `<article class="record-row" data-record-id="${r.id}">
            <div class="record-date">${formatListDate(r)}</div>
            <div class="record-main"><strong>${escapeHTML(r.title)}</strong><span>${escapeHTML(r.project || r.notes || '未填写项目')}</span></div>
            <div class="record-meta record-place">${escapeHTML(r.place || '—')}</div>
            <div class="record-meta record-owner">${escapeHTML(r.owner || '未分配')}</div>
            <span class="status-badge record-status ${STATUS[r.status].className}">${STATUS[r.status].label}</span>
            ${sharedMode ? '<span></span>' : `<button class="row-edit editor-only" data-record-id="${r.id}" aria-label="编辑${escapeHTML(r.title)}">•••</button>`}
          </article>`).join('');
          html += '</section>';
        });
        els.viewRoot.innerHTML = html + '</div>';
      }

      function emptyState(message) {
        return `<div class="empty-state"><div><div class="empty-illustration"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h8"/></svg></div><h3>${escapeHTML(message)}</h3><p>调整筛选条件，或添加一条新的工作记录。</p>${sharedMode ? '' : '<button class="btn btn-primary editor-only" data-empty-add>添加第一条记录</button>'}</div></div>`;
      }

      function handleViewClick(event) {
        const recordTarget = event.target.closest('[data-record-id]');
        const addTarget = event.target.closest('[data-add-date]');
        const monthTarget = event.target.closest('[data-open-month]');
        const dateTarget = event.target.closest('[data-open-date]');
        if (recordTarget) {
          const record = records.find(r => r.id === recordTarget.dataset.recordId);
          if (record) sharedMode ? openDetailModal(record) : openModal(record);
        }
        if (addTarget && !sharedMode) openModal(null, addTarget.dataset.addDate);
        if (event.target.closest('[data-empty-add]') && !sharedMode) openModal();
        if (monthTarget) { cursor = new Date(cursor.getFullYear(), Number(monthTarget.dataset.openMonth), 1); setView('month'); }
        if (dateTarget && dateTarget.classList.contains('has-event')) { cursor = parseDate(dateTarget.dataset.openDate); setView('month'); }
      }

      function openModal(record, defaultDate) {
        const data = record || makeRecord({ startDate: defaultDate || toISODate(cursor), endDate: defaultDate || toISODate(cursor), color: COLORS[0] });
        document.getElementById('recordId').value = record ? record.id : '';
        document.getElementById('recordTitle').value = data.title;
        document.getElementById('recordProject').value = data.project;
        document.getElementById('recordOwner').value = data.owner;
        document.getElementById('recordStartDate').value = data.startDate;
        document.getElementById('recordEndDate').value = data.endDate;
        document.getElementById('recordStartTime').value = data.startTime;
        document.getElementById('recordEndTime').value = data.endTime;
        document.getElementById('recordStatus').value = data.status;
        document.getElementById('recordPriority').value = data.priority;
        document.getElementById('recordPlace').value = data.place;
        document.getElementById('recordNotes').value = data.notes;
        const colorInput = document.querySelector(`input[name="recordColor"][value="${data.color}"]`) || document.querySelector('input[name="recordColor"]');
        colorInput.checked = true;
        els.modalTitle.textContent = record ? '编辑工作记录' : '添加工作记录';
        els.deleteBtn.hidden = !record;
        els.formError.textContent = '';
        els.modal.hidden = false;
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('recordTitle').focus(), 40);
      }

      function closeModal() {
        if (!els.modal) return;
        els.modal.hidden = true;
        document.body.style.overflow = '';
      }

      function openDetailModal(record) {
        const status = STATUS[record.status];
        const priority = { normal: '普通', high: '高', urgent: '紧急' }[record.priority] || '普通';
        const dateRange = record.startDate === record.endDate ? record.startDate : `${record.startDate} — ${record.endDate}`;
        els.detailAccent.style.setProperty('--detail-color', record.color);
        els.detailContent.innerHTML = `
          <div class="detail-title-row">
            <div><h3 id="detailTitle">${escapeHTML(record.title)}</h3><p class="detail-project">${escapeHTML(record.project || '未填写项目 / 分类')}</p></div>
            <span class="status-badge ${status.className}">${status.label}</span>
          </div>
          <div class="detail-grid">
            ${detailItem('日期', dateRange)}
            ${detailItem('时间', formatTimeRange(record))}
            ${detailItem('负责人', record.owner || '未分配')}
            ${detailItem('地点 / 渠道', record.place || '未填写')}
            ${detailItem('优先级', priority)}
            ${detailItem('最后更新', formatDateTime(record.updatedAt))}
          </div>
          <div class="detail-notes"><span class="detail-notes-label">补充说明</span>${escapeHTML(record.notes || '暂无补充说明')}</div>
          <div class="detail-footer"><button class="btn" type="button" data-close-detail>关闭</button></div>`;
        els.detailContent.querySelector('[data-close-detail]').addEventListener('click', closeDetailModal);
        els.detailModal.hidden = false;
        document.body.style.overflow = 'hidden';
        document.getElementById('closeDetailBtn').focus();
      }

      function closeDetailModal() {
        els.detailModal.hidden = true;
        document.body.style.overflow = '';
      }

      function detailItem(label, value) {
        return `<div class="detail-item"><span class="detail-label">${escapeHTML(label)}</span><span class="detail-value">${escapeHTML(value)}</span></div>`;
      }

      function saveForm(event) {
        event.preventDefault();
        const id = document.getElementById('recordId').value;
        const record = makeRecord({
          id: id || crypto.randomUUID(), title: document.getElementById('recordTitle').value.trim(),
          project: document.getElementById('recordProject').value.trim(), owner: document.getElementById('recordOwner').value.trim(),
          startDate: document.getElementById('recordStartDate').value, endDate: document.getElementById('recordEndDate').value,
          startTime: document.getElementById('recordStartTime').value, endTime: document.getElementById('recordEndTime').value,
          status: document.getElementById('recordStatus').value, priority: document.getElementById('recordPriority').value,
          place: document.getElementById('recordPlace').value.trim(), notes: document.getElementById('recordNotes').value.trim(),
          color: document.querySelector('input[name="recordColor"]:checked').value,
          createdAt: id ? records.find(r => r.id === id)?.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString()
        });
        if (!record.title || !record.startDate || !record.endDate) { els.formError.textContent = '请完整填写工作内容、开始日期和结束日期。'; return; }
        if (record.startDate > record.endDate) { els.formError.textContent = '开始日期不能晚于结束日期。'; return; }
        if (record.startDate === record.endDate && record.startTime && record.endTime && record.startTime >= record.endTime) { els.formError.textContent = '结束时间需要晚于开始时间。'; return; }
        if (id) records = records.map(item => item.id === id ? record : item); else records.push(record);
        saveRecords();
        closeModal();
        refresh();
        showToast(id ? '工作记录已更新' : '工作记录已添加');
      }

      function deleteCurrentRecord() {
        const id = document.getElementById('recordId').value;
        const record = records.find(item => item.id === id);
        if (!record || !confirm(`确认删除“${record.title}”？此操作无法撤销。`)) return;
        records = records.filter(item => item.id !== id);
        saveRecords();
        closeModal();
        refresh();
        showToast('工作记录已删除');
      }

      function setupColorOptions() {
        const colorOptions = document.getElementById('colorOptions');
        if (colorOptions) colorOptions.innerHTML = COLORS.map((color, index) => `<label class="color-option" title="颜色 ${index + 1}"><input type="radio" name="recordColor" value="${color}" ${index === 0 ? 'checked' : ''}><span class="color-swatch" style="--swatch:${color}"></span></label>`).join('');
      }

      function exportJsonData() {
        const payload = {
          schemaVersion: 1,
          exportedAt: new Date().toISOString(),
          records
        };
        downloadBlob(JSON.stringify(payload, null, 2), `工作排期数据_${toISODate(new Date())}.json`, 'application/json;charset=utf-8');
        showToast(`已导出 ${records.length} 条 JSON 数据`);
      }

      function exportStaticHtml() {
        try {
          const clone = document.documentElement.cloneNode(true);
          clone.querySelector('body').classList.add('shared-mode');
          clone.querySelector('.topbar')?.remove();
          clone.querySelector('.hero')?.remove();
          clone.querySelector('.share-banner')?.remove();
          clone.querySelector('title')?.remove();
          clone.querySelector('#recordModal')?.remove();
          clone.querySelectorAll('.editor-only').forEach(node => node.remove());
          clone.querySelector('#detailModal')?.setAttribute('hidden', '');
          clone.querySelectorAll('.toast').forEach(node => node.remove());
          clone.querySelector('#searchInput')?.setAttribute('value', els.search.value);
          const payload = JSON.stringify(records).replace(/</g, '\\u003c');
          const stateScript = document.createElement('script');
          stateScript.textContent = `window.__SHARED_MODE__=true;window.__SHARED_WORK_RECORDS__=${payload};window.__SHARED_VIEW__=${JSON.stringify(activeView)};window.__SHARED_CURSOR__=${JSON.stringify(toISODate(cursor))};window.__SHARED_AT__=${JSON.stringify(new Intl.DateTimeFormat('zh-CN',{dateStyle:'long',timeStyle:'short'}).format(new Date()))};`;
          clone.querySelector('head').appendChild(stateScript);
          const html = '<!DOCTYPE html>\n' + clone.outerHTML;
          downloadBlob(html, `工作排期_${toISODate(new Date())}.html`, 'text/html;charset=utf-8');
          showToast('静态 HTML 已生成，可直接分享');
        } catch (error) {
          console.error(error);
          showToast('导出失败，请重试', true);
        }
      }

      async function importData(event) {
        const file = event.target.files[0];
        event.target.value = '';
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (!Array.isArray(parsed) && parsed.schemaVersion != null && parsed.schemaVersion !== 1) throw new Error('unsupported-version');
          const imported = normalizeRecords(Array.isArray(parsed) ? parsed : parsed.records);
          if (!imported.length) throw new Error('empty');
          if (!confirm(`将导入 ${imported.length} 条记录，并替换当前数据。是否继续？`)) return;
          records = imported;
          saveRecords();
          refresh();
          showToast(`已导入 ${imported.length} 条记录`);
        } catch (error) {
          showToast('无法导入：请选择有效的排期 JSON 文件', true);
        }
      }

      function downloadBlob(content, filename, type) {
        const url = URL.createObjectURL(new Blob([content], { type }));
        const link = document.createElement('a');
        link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      }

      function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.textContent = message;
        els.toast.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
      }

      function saveRecords() {
        if (!sharedMode) localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function loadRecords() {
        try { return normalizeRecords(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
        catch { return []; }
      }

      function normalizeRecords(input) {
        if (!Array.isArray(input)) return [];
        const datePattern = /^\d{4}-\d{2}-\d{2}$/;
        return input.filter(item => item && item.title && datePattern.test(item.startDate) && datePattern.test(item.endDate) && item.startDate <= item.endDate).map(item => makeRecord(item));
      }

      function makeRecord(overrides = {}) {
        return {
          id: overrides.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
          title: overrides.title || '', project: overrides.project || '', owner: overrides.owner || '',
          startDate: overrides.startDate || toISODate(today), endDate: overrides.endDate || overrides.startDate || toISODate(today),
          startTime: overrides.startTime || '', endTime: overrides.endTime || '', status: STATUS[overrides.status] ? overrides.status : 'todo',
          priority: ['normal','high','urgent'].includes(overrides.priority) ? overrides.priority : 'normal', place: overrides.place || '', notes: overrides.notes || '',
          color: COLORS.includes(overrides.color) ? overrides.color : COLORS[0], createdAt: overrides.createdAt || new Date().toISOString(), updatedAt: overrides.updatedAt || new Date().toISOString()
        };
      }

      function compareRecords(a, b) { return `${a.startDate} ${a.startTime}`.localeCompare(`${b.startDate} ${b.startTime}`, 'zh-CN'); }
      function coversDate(record, day) { const iso = toISODate(day); return record.startDate <= iso && record.endDate >= iso; }
      function overlaps(record, start, end) { return record.startDate <= toISODate(end) && record.endDate >= toISODate(start); }
      function startOfDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
      function startOfWeek(date) { const day = startOfDay(date); return addDays(day, -((day.getDay() + 6) % 7)); }
      function addDays(date, amount) { const result = new Date(date); result.setDate(result.getDate() + amount); return result; }
      function isSameDay(a, b) { return toISODate(a) === toISODate(b); }
      function parseDate(value) { const [y,m,d] = String(value).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
      function toISODate(date) { const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0'); return `${y}-${m}-${d}`; }
      function formatShortDate(date) { return `${date.getMonth() + 1}月${date.getDate()}日`; }
      function formatTimeRange(record) { if (!record.startTime && !record.endTime) return '全天'; return [record.startTime || '—', record.endTime || '—'].join('–'); }
      function formatListDate(record) { const start = parseDate(record.startDate); const end = parseDate(record.endDate); const left = `${start.getMonth() + 1}/${String(start.getDate()).padStart(2,'0')}`; return record.startDate === record.endDate ? `${left}\n${formatTimeRange(record)}` : `${left} — ${end.getMonth() + 1}/${String(end.getDate()).padStart(2,'0')}`; }
      function formatDateTime(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? '—' : new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium', timeStyle: 'short' }).format(date); }
      function groupBy(items, keyFn) { return items.reduce((result, item) => { const key = keyFn(item); (result[key] ||= []).push(item); return result; }, {}); }
      function escapeHTML(value) { return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    })();
  </script>
</body>
